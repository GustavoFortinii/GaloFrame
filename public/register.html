<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo.png">
    <title>GaloFrame - Cadastro</title>
    
</head>
<style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
                        url("./assets/images/fundo0.png") center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #login{
            font-weight: 600;
            color: #DA291C;
        }
        #login:hover{
            color:#DA291C;
            text-decoration: underline;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            background: rgba(15, 15, 15, 0.78);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -3px;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .destaque {
            color: #000000;
        }

        .logo-dot {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: #DA291C;
            border-radius: 50%;
            margin-bottom: 13px;
            position: relative;
            right: 7px;
        }

        .subtitle {
            color: #bdbdbd;
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #DA291C;
            box-shadow: 0 0 0 3px rgba(218, 41, 28, 0.2),
                        0 0 15px rgba(218, 41, 28, 0.15);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: #DA291C;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            background: #c42318;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(218, 41, 28, 0.35);
        }

        .error {
            color: #ff6b6b;
            margin: 10px 0;
            font-size: 0.95rem;
        }

        .success {
            color: #4ade80;
            margin: 10px 0;
            font-size: 0.95rem;
        }

        .links {
            margin-top: 25px;
            color: #a5a5a5;
        }

        .links a {
            color: #a5a5a5;
            text-decoration: none;
        }

        .links a:hover {
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
            }
            .logo {
                font-size: 38px;
            }
        }
</style>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="destaque">Galo</span>Frame
            <span class="logo-dot"></span>
        </div>

        <p class="subtitle">
            Crie sua conta e comece a registrar suas histórias.
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" placeholder="Escolha um nome de usuário" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required>
            </div>

            <p id="errorMessage" class="error"></p>
            <p id="successMessage" class="success"></p>

            <button type="submit" class="register-btn">Cadastrar</button>
        </form>

        <div class="links">
          Já tem uma conta?<a id="login" href="login.html"> Faça login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Limpa mensagens anteriores
            errorMsg.textContent = '';
            successMsg.textContent = '';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações
            if (password !== confirmPassword) {
                errorMsg.textContent = 'As senhas não coincidem!';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'A senha deve ter pelo menos 6 caracteres!';
                return;
            }

            if (username.length < 3) {
                errorMsg.textContent = 'O nome de usuário deve ter pelo menos 3 caracteres!';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = 'Cadastro realizado com sucesso! Redirecionando...';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.error || 'Erro ao realizar cadastro';
                }
            } catch (error) {
                errorMsg.textContent = 'Erro de conexão com o servidor. Tente novamente.';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/assets/styles/register.css">
    <link rel="icon" href="assets/images/logo.png">
    <title>GaloFrame - Cadastro</title>
    
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="destaque">Galo</span>Frame
            <span class="logo-dot"></span>
        </div>

        <p class="subtitle">
            Crie sua conta e comece a registrar suas histórias.
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" placeholder="Escolha um nome de usuário" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required>
            </div>

            <p id="errorMessage" class="error"></p>
            <p id="successMessage" class="success"></p>

            <button type="submit" class="register-btn">Cadastrar</button>
        </form>

        <div class="links">
          Já tem uma conta?<a id="login" href="login.html"> Faça login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Limpa mensagens anteriores
            errorMsg.textContent = '';
            successMsg.textContent = '';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações
            if (password !== confirmPassword) {
                errorMsg.textContent = 'As senhas não coincidem!';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'A senha deve ter pelo menos 6 caracteres!';
                return;
            }

            if (username.length < 3) {
                errorMsg.textContent = 'O nome de usuário deve ter pelo menos 3 caracteres!';
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.textContent = 'Cadastro realizado com sucesso! Redirecionando...';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.error || 'Erro ao realizar cadastro';
                }
            } catch (error) {
                errorMsg.textContent = 'Erro de conexão com o servidor. Tente novamente.';
            }
        });
    </script>
</body>
</html>

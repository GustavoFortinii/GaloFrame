<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaloFrame - Feed</title>
    <link rel="stylesheet" href="./assets/styles/home.css">
    <link rel="icon" href="assets/images/logo.png">
    <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>
    
    <style>
        .feed-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .memory-card {
            background: #111;
            border-radius: 16px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .memory-card img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
        }
        .memory-info {
            padding: 20px;
        }
        .memory-title {
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            color: white;
        }
        .memory-meta {
            color: #aaa;
            font-size: 0.95rem;
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }
        .memory-description {
            color: #ddd;
            line-height: 1.5;
        }
        .empty-feed {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Header (mesmo do home.html) -->
    <header>
        <div class="nav">
            <div class="logo" onclick="window.location.href='home.html'">
                <span class="destaque">Galo</span>Frame <div class="logo-dot"></div>
            </div>
            
            <input type="text" class="search-bar" placeholder="Buscar momentos alvinegros..." onkeyup="filtrarFeed(this.value)">

            <div class="main-nav">
                <a href="home.html">
                    <div class="nav-item">Início</div>
                </a>
                <a href="feed.html">
                    <div class="nav-item active">Feed</div>
                </a>
                <a href="studio.html">
                    <div class="nav-item">Studio</div>
                </a>
                <a href="perfil.html">
                    <div class="nav-item">Perfil</div>
                </a>
            </div>
        </div>
    </header>

    <div class="feed-container">
        <h1 style="text-align:center; margin: 30px 0;">Feed da Massa</h1>
        <div id="feed" class="feed"></div>
        
        <div id="emptyFeed" class="empty-feed" style="display:none;">
            <h2>Nenhuma memória ainda</h2>
            <p>Seja o primeiro a registrar um momento com o Galo!</p>
            <a href="studio.html" style="color:#DA291C; text-decoration:underline;">Ir para o Studio →</a>
        </div>
    </div>

    <script type="module">
    import db from './db.js'; // Importa o banco unificado

    async function carregarFeed() {
        // ... seu código de carregar o feed usando o 'db' centralizado
    }
    window.onload = carregarFeed;
</script>
</body>
</html>

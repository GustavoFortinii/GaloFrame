<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaloFrame - Login</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="./assets/styles/login.css">
</head>
<body>

  <div class="login-container">
    
    <div class="logo">
      <span class="destaque">Galo</span>Frame
      <span class="logo-dot"></span>
    </div>

    <p class="subtitle">
      Entre para registrar suas histórias.
    </p>

    <form id="loginForm">
      <div class="form-group">
        <input type="text" id="username" placeholder="Nome de usuário ou e-mail" required>
      </div>

      <div class="form-group">
        <input type="password" id="password" placeholder="Senha" required>
      </div>

      <p id="errorMessage" class="error"></p>
      <p id="successMessage" class="success"></p>

      <button type="submit" class="login-btn">Entrar</button>
    </form>

    <div class="forgot">
      <a href="#">Esqueci minha senha</a>
    </div>

    <div class="register">
      Não tem conta?
      <a href="register.html">Crie agora</a>
    </div>

  </div>

  <script src="./assets/scripts/login.js"></script>

</body>
</html>
